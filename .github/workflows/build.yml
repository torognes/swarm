name: Build

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build for Linux x86_64
      run: |
        make clean
        make RELEASE=1
        bin/swarm -v

    - name: Install and run tests
      run: |
        sudo apt-get update
        sudo apt-get -y install valgrind
        export PATH=$PWD/bin:$PATH
        git clone --branch ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }} https://github.com/frederic-mahe/swarm-tests
        cd swarm-tests
        bash ./run_all_tests.sh


  linux-gcc-legacy:
    # Guard the documented minimum compiler (GCC 4.9). The gcc:4.9 image
    # is Debian jessie, whose glibc (2.19) predates the glibc 2.28 the
    # Node.js runtime behind JavaScript actions (actions/checkout and
    # friends) needs, so this job uses no 'uses:' steps and fetches the
    # sources by hand. It fetches github.ref -- a real ref (refs/heads/*
    # for pushes, refs/pull/N/merge for pull requests) -- rather than a
    # bare commit SHA, which the jessie-era git client (2.1) cannot fetch.
    runs-on: ubuntu-latest
    container: gcc:4.9
    timeout-minutes: 30

    steps:
    - name: Fetch swarm at the tested revision
      run: |
        git init -q .
        git remote add origin "https://github.com/${{ github.repository }}.git"
        git fetch --depth 1 origin "${{ github.ref }}"
        git checkout -q --detach FETCH_HEAD

    - name: Build for Linux x86_64 (GCC 4.9)
      run: |
        g++ --version
        make clean
        make RELEASE=1
        bin/swarm -v

    - name: Install and run tests
      run: |
        # Steps run as root inside the container, but the test-suite's
        # "file not readable/writable" checks need an unprivileged user
        # (root bypasses POSIX permission checks), as in the FreeBSD job.
        useradd -m runner
        git clone --branch ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }} https://github.com/frederic-mahe/swarm-tests
        chown -R runner swarm-tests
        su runner -c "cd swarm-tests && PATH=$PWD/bin:\$PATH bash ./run_all_tests.sh"


  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: windows-x86_64, cxx: x86_64-w64-mingw32-g++,    pkg: mingw-w64 }
          - { name: linux-aarch64,  cxx: aarch64-linux-gnu-g++,     pkg: g++-aarch64-linux-gnu }
          - { name: linux-ppc64le,  cxx: powerpc64le-linux-gnu-g++, pkg: g++-powerpc64le-linux-gnu }

    name: cross-build (${{ matrix.target.name }})

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install make ${{ matrix.target.pkg }}

    - name: Build for ${{ matrix.target.name }}
      run: |
        make clean
        make CXX="${{ matrix.target.cxx }}" RELEASE=1


  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build for macos aarch64
      run: |
        make clean
        make RELEASE=1
        bin/swarm -v

    - name: Install and run tests
      run: |
        export PATH=$PWD/bin:$PATH
        git clone --branch ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }} https://github.com/frederic-mahe/swarm-tests
        cd swarm-tests
        bash ./run_all_tests.sh


  macos-x86_64:
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build for macos x86_64
      run: |
        make clean
        make RELEASE=1
        bin/swarm -v

    - name: Install and run tests
      run: |
        export PATH=$PWD/bin:$PATH
        git clone --branch ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }} https://github.com/frederic-mahe/swarm-tests
        cd swarm-tests
        bash ./run_all_tests.sh


  freebsd-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build and test on FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg update -f
          pkg install -y gmake bash git
          pw useradd -n runner -m -s /usr/local/bin/bash
        run: |
          gmake clean
          gmake RELEASE=1
          bin/swarm -v
          git clone --branch ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }} https://github.com/frederic-mahe/swarm-tests
          chown -R runner swarm-tests
          # root bypasses POSIX permission checks, so the "file not
          # readable/writable" tests need an unprivileged user
          su -m runner -c "cd swarm-tests && PATH=$PWD/bin:\$PATH bash ./run_all_tests.sh"
